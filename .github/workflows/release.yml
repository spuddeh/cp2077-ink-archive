# Build the complete database from the committed JSONL and attach it to a GitHub Release, so
# tools can download a pinned, hashed copy instead of running build.py. A tag v<game>.<n> starts
# it: v2.31.0 is the first release built from game 2.31's archive.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the database
        run: |
          python build.py --db ink.db
          python -c "import zipfile; zipfile.ZipFile('ink.db.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9).write('ink.db')"
          sha256sum ink.db | tee ink.db.sha256
          ls -l ink.db ink.db.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ink.db.zip ink.db.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "The complete database (ink.db) built from raw/ at this tag by build.py. ink.db.sha256 is the hash of the unzipped file."
